name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,academic]"
      - run: python -m compileall -q src
      - run: pytest --collect-only -q
      - run: pytest -m "not visual"
      - run: python scripts/update_diagnostics.py --check
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/mddocx/source.py src/mddocx/compiler.py src/mddocx/batch.py src/mddocx/config_validation.py src/mddocx/extensions/base.py src/mddocx/layout.py src/mddocx/math/preflight.py src/mddocx/normalize/semantic.py src/mddocx/normalize/normalizer.py src/mddocx/render/context.py src/mddocx/render/math_renderer.py --ignore-missing-imports --follow-imports=skip --check-untyped-defs
      - run: mddocx doctor
      - run: mddocx benchmark --sections 1 --max-seconds 30 --max-peak-mb 512
      - run: mddocx benchmark --sections 20 --max-seconds 30 --max-peak-mb 512
      - name: Benchmark large document (Linux budget)
        if: runner.os == 'Linux'
        run: mddocx benchmark --sections 100 --max-seconds 30 --max-peak-mb 512
      - name: Benchmark large document (macOS/Windows budget)
        if: runner.os != 'Linux'
        run: mddocx benchmark --sections 100 --max-seconds 60 --max-peak-mb 512

  visual-linux:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update
      - run: sudo apt-get install -y libreoffice-writer poppler-utils fonts-dejavu-core
      - run: python -m pip install -e ".[dev,academic]"
      # Visual QA is an optional cross-check and the tests skip when the office
      # renderer is missing. Assert it is really here, so a runner that lost the
      # tools fails loudly instead of silently skipping every visual test.
      - name: Assert the visual renderer is available
        shell: bash
        run: |
          # doctor exits 2 on any issue, so capture its report and assert on the
          # capability itself: this step must fail for one reason only.
          mddocx doctor --json > doctor.json || true
          python -c "import json,sys; r=json.load(open('doctor.json')); print('visual_qa_ready:', r['visual_qa_ready']); sys.exit(0 if r['visual_qa_ready'] else 1)"
      - run: pytest -m visual -rs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test built wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/mddocx-wheel
          /tmp/mddocx-wheel/bin/python -m pip install dist/*.whl
          /tmp/mddocx-wheel/bin/mddocx --version
          /tmp/mddocx-wheel/bin/mddocx-native --version
          /tmp/mddocx-wheel/bin/python -m mddocx --version
          /tmp/mddocx-wheel/bin/mddocx doctor
          /tmp/mddocx-wheel/bin/mddocx tests/fixtures/ai_markdown/chatgpt_sphere_equations.md -o /tmp/ai-math.docx
          /tmp/mddocx-wheel/bin/mddocx inspect /tmp/ai-math.docx --strict
          /tmp/mddocx-wheel/bin/mddocx math-check tests/fixtures/ai_markdown/chatgpt_sphere_equations.md --strict
          /tmp/mddocx-wheel/bin/mddocx api --json > /tmp/public-api.json
          /tmp/mddocx-wheel/bin/mddocx capabilities --json > /tmp/capabilities.json
          printf '# Package verification\n\nEditable equation $x^2$.\n' > /tmp/verify.md
          /tmp/mddocx-wheel/bin/mddocx /tmp/verify.md -o /tmp/verify.docx
          /tmp/mddocx-wheel/bin/mddocx verify /tmp/verify.md /tmp/verify.docx --json
          /tmp/mddocx-wheel/bin/python -c "import json; p=json.load(open('/tmp/public-api.json')); assert p['api_version']=='1'"
      - name: Smoke-test optional extras from the built wheel
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2
          wheel=$(ls dist/*.whl | head -1)
          python -m venv /tmp/mddocx-extras
          /tmp/mddocx-extras/bin/python -m pip install "${wheel}[all]"
          /tmp/mddocx-extras/bin/python -c "import cairosvg, citeproc, latex2mathml"
          /tmp/mddocx-extras/bin/mddocx doctor
          /tmp/mddocx-extras/bin/python -m mddocx tests/fixtures/ai_markdown/chatgpt_sphere_equations.md -o /tmp/extras-math.docx
      - name: Smoke-test source distribution in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/mddocx-sdist
          /tmp/mddocx-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/mddocx-sdist/bin/python -c "import importlib.metadata as md, mddocx; assert mddocx.__version__ == md.version('mddocx-native')"
