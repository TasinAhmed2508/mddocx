name: Build and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    name: Verify release candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,academic]"
      - run: python -m compileall -q src
      - run: pytest -m "not visual"
      - run: python scripts/update_diagnostics.py --check
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/mddocx/source.py src/mddocx/compiler.py src/mddocx/batch.py src/mddocx/config_validation.py src/mddocx/extensions/base.py src/mddocx/layout.py src/mddocx/math/preflight.py src/mddocx/normalize/semantic.py src/mddocx/normalize/normalizer.py src/mddocx/render/context.py src/mddocx/render/math_renderer.py --ignore-missing-imports --follow-imports=skip --check-untyped-defs

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the exact publication archives in clean environments
        shell: bash
        run: |
          printf '# Release check\n\nNative equation $x^2$.\n' > "$RUNNER_TEMP/release-smoke.md"
          for artifact in dist/*.whl dist/*.tar.gz; do
            envdir="$(mktemp -d)"
            python -m venv "$envdir"
            "$envdir/bin/python" -m pip install "$artifact"
            "$envdir/bin/python" -c 'import importlib.metadata as m, mddocx; assert mddocx.__version__ == m.version("mddocx-native")'
            "$envdir/bin/mddocx" --version
            "$envdir/bin/mddocx-native" --version
            "$envdir/bin/python" -m mddocx --version
            "$envdir/bin/mddocx" doctor
            "$envdir/bin/mddocx" "$RUNNER_TEMP/release-smoke.md" -o "$envdir/smoke.docx"
            "$envdir/bin/mddocx" verify "$RUNNER_TEMP/release-smoke.md" "$envdir/smoke.docx" --json
            "$envdir/bin/mddocx" capabilities --json
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mddocx-dist
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: dist/*

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mddocx-native/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mddocx-dist
          path: dist
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
