name: Build and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest -m "not visual"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/mddocx/source.py src/mddocx/compiler.py src/mddocx/batch.py src/mddocx/config_validation.py src/mddocx/extensions/base.py src/mddocx/layout.py src/mddocx/math/preflight.py src/mddocx/normalize/semantic.py src/mddocx/normalize/normalizer.py src/mddocx/render/context.py src/mddocx/render/math_renderer.py --ignore-missing-imports --follow-imports=skip --check-untyped-defs

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: mddocx-dist
          path: dist/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mddocx-native/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mddocx-dist
          path: dist
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
